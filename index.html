<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Consultas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consultas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>window.API_URL="https://script.google.com/macros/s/AKfycbxVh729gT4Cko8i1cXP90IeLBKCM0i_9rVNT6x0ZFsocNmfT_eZdWKGEmMWfCkK2lrF/exec";</script>

<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --navy:#152038; --navy-2:#22325a; --mint:#12C79A; --mint-ink:#0A8A6A;
  --bg:#EEF1F6; --paper:#FFFFFF; --paper-2:#F5F7FB;
  --ink:#152038; --ink-2:#56607A; --ink-3:#8A93A8; --line:#DDE2EC;
  --green:#0F7F5C; --green-bg:#D9F4EA;
  --amber:#B87800; --amber-bg:#FFF2D2;
  --orange:#D2601A; --orange-bg:#FFE9DA;
  --red:#C9372F; --red-bg:#FDE6E4;
  --blue:#2462D6; --blue-bg:#E3ECFC;
  --violet:#6A4FD0; --violet-bg:#ECE8FC;
  --wine:#962B32; --wine-bg:#F6E1E2;
  --char:#3A3E48; --char-bg:#E5E7EB;
  --sand:#7D725E; --sand-bg:#EFEBE3;
  --wa:#18A058;
  --cond:72%;
  --r-lg:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#0B1222; --navy-2:#1B2948; --mint:#22D3A6; --mint-ink:#3FE0B5;
    --bg:#0E1626; --paper:#17213A; --paper-2:#1D2843;
    --ink:#E9EDF5; --ink-2:#AAB3C8; --ink-3:#7A849E; --line:#27324E;
    --green:#4ADBA8; --green-bg:#123A33;
    --amber:#F2BE4A; --amber-bg:#3A2F12;
    --orange:#FF9A57; --orange-bg:#3D2516;
    --red:#FF7B73; --red-bg:#3D1C1E;
    --blue:#7FA8FF; --blue-bg:#1A2C52;
    --violet:#B3A2FF; --violet-bg:#2A2452;
    --wine:#FF8A93; --wine-bg:#3B1C22;
    --char:#C9CDD6; --char-bg:#2C3345;
    --sand:#CFC3AA; --sand-bg:#33302A;
    --wa:#3BD07F;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Encabezado ===== */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 10px}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.top-row{display:flex;align-items:flex-start;gap:8px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-weight:800;font-stretch:var(--cond);font-size:31px;line-height:1.02;letter-spacing:-.01em}
.ttl p{margin:3px 0 0;font-size:14px;color:var(--ink-2);font-weight:500}
/* Celulares: el subtítulo usa todo el ancho debajo de los botones (no queda apretado en 3-4 renglones) y el título no se corta en 360px */
@media (max-width:430px){
  .top-row{flex-wrap:wrap;row-gap:0}
  .ttl{display:contents}
  .ttl h1{flex:1 1 0;min-width:0;align-self:center;overflow-wrap:anywhere}
  .ttl p{order:9;flex:0 0 100%;margin-top:4px}
}
@media (max-width:370px){ .ttl h1{font-size:27px} }
.hbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);flex:none;box-shadow:0 0 0 1px var(--line) inset}
.hbtn svg{width:20px;height:20px}
.hbtn.yo{width:auto;max-width:116px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;white-space:nowrap}
.hbtn.yo span:first-child{overflow:hidden;text-overflow:ellipsis}
.hbtn.yo[hidden]{display:none}
.hbtn[hidden]{display:none}
.hbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:3px;margin-top:8px;background:var(--paper);border-radius:12px;padding:3px;box-shadow:0 0 0 1px var(--line) inset;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:58px;height:32px;padding:0 10px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){.seg button.on{background:var(--mint);color:#062a20}}
.wnav{display:flex;align-items:center;gap:6px;margin-top:8px}
.head-extra{padding:0 16px}
.agbar{display:flex;gap:8px;align-items:center;margin-top:8px}
.agbar .wnav{flex:1;margin-top:0;min-width:0}
.agbar .wnav .arr{width:34px;height:34px;font-size:20px}
.agbar .wnav .wl{font-size:14px}
.agbar .wnav .wl small{font-size:11.5px}
.agbar .seg2{margin-top:0;flex:none}
.agbar .seg2 button{flex:none;padding:0 12px;height:30px}
/* Zona táctil de 44px en las flechas de semana y Día/Semana de la agenda, sin cambiar cómo se ven */
.agbar .wnav .arr,.agbar .seg2 button{position:relative}
.agbar .wnav .arr::after{content:'';position:absolute;inset:-5px}
.agbar .seg2 button::after{content:'';position:absolute;left:0;right:0;top:-7px;bottom:-7px}
.next-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:8px;padding:11px 14px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-weight:700;font-size:14.5px;text-align:left;color:var(--ink)}
.next-bar.warn2{background:#FDEBDD;box-shadow:none;color:#9A3D0B}
.next-bar b{white-space:nowrap}
.wnav .arr{width:42px;height:38px;border-radius:10px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-size:22px;font-weight:700;color:var(--ink)}
.wnav .wl{flex:1;text-align:center;font-weight:700;font-size:15px}
.wnav .wl small{display:block;color:var(--ink-3);font-weight:500;font-size:12.5px}

main{padding:4px 16px 8px}

/* ===== Próxima consulta ===== */
.next{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:16px 16px 14px;margin-top:6px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(18,199,154,.35),rgba(18,199,154,0) 70%);pointer-events:none}
.next-when{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#B9C3DA}
.next-when b{color:var(--mint);font-weight:800}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:pl 2s infinite;flex:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(18,199,154,.55)}70%{box-shadow:0 0 0 10px rgba(18,199,154,0)}100%{box-shadow:0 0 0 0 rgba(18,199,154,0)}}
.next-main{display:flex;align-items:center;gap:14px;margin-top:8px;width:100%;text-align:left;color:#fff}
.next-hr{font-weight:800;font-stretch:var(--cond);font-size:46px;line-height:.9;letter-spacing:-.01em}
.next-nm{display:block;font-weight:700;font-size:20px;line-height:1.15}
.next-sub{display:block;font-size:14px;color:#B9C3DA;margin-top:2px}
.next-st{display:inline-flex;margin-top:10px;font-size:14px;font-weight:700;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 11px}
.next-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.next-acts a{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;font-weight:700;font-size:15.5px;background:rgba(255,255,255,.12);color:#fff}
.next-acts a.wa{background:var(--wa)}
.next-acts svg{width:19px;height:19px}
.next.calm{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.next.calm::after{display:none}
.next.calm .next-nm{font-size:18px}
.next.calm .next-sub{color:var(--ink-2)}
.go{margin-top:12px;height:44px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;width:100%}
@media (prefers-color-scheme: dark){.go{background:var(--mint);color:#062a20}}
@media (prefers-color-scheme: dark){.next{box-shadow:0 0 0 1px var(--line) inset}.next-acts a.wa,.big-acts a.wa{color:#04200f}}

/* ===== Filtros ===== */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 2px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chip b{font-weight:800;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.on b{color:var(--paper)}
.chip.add{color:var(--ink);gap:6px}
.chip.add svg{width:16px;height:16px}

/* ===== Orden del día ===== */
.grp{margin-top:18px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.grp-h h2{margin:0;font-size:19px;font-weight:800}
.grp-h .n{font-weight:800;font-size:13px;min-width:24px;height:22px;border-radius:999px;background:var(--navy);color:#fff;display:inline-grid;place-items:center;padding:0 7px;transform:translateY(-2px)}
@media (prefers-color-scheme: dark){.grp-h .n{background:var(--navy-2)}}
.grp-h .sub{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:500;text-align:right}
.dk{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.it{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it-main{display:grid;grid-template-columns:auto 1fr;text-align:left;width:100%;min-height:76px}
.tm{position:relative;min-width:72px;padding:14px 10px 12px 16px;font-weight:800;font-stretch:var(--cond);font-size:24px;line-height:1;letter-spacing:-.01em}
.tm::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.tm small{display:block;font-stretch:100%;font-weight:600;font-size:11.5px;color:var(--ink-3);letter-spacing:0;margin-bottom:4px}
.tm .to{display:block;font-stretch:100%;font-weight:600;font-size:12px;color:var(--ink-3);letter-spacing:0;margin-top:4px}
.tx{padding:12px 6px 12px 4px;min-width:0}
.nm{display:block;font-weight:700;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--c);background:var(--cb);border-radius:10px;padding:3px 9px}
.rama{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;box-shadow:0 0 0 1.5px currentColor inset}
.r-art{color:var(--navy-2)} .r-laboral{color:var(--violet)} .r-transito{color:#0B8B8B}
@media (prefers-color-scheme: dark){.r-art{color:#9FB4E8} .r-transito{color:#5FD6D6}}
.reag{font-size:12px;font-weight:700;color:var(--violet)}
.cf{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cp{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--paper-2);border-radius:7px;padding:2px 7px}
.cp.ok{color:var(--green);background:var(--green-bg)}
.cp.no{color:var(--red);background:var(--red-bg)}
.cp.nt{color:var(--blue);background:var(--blue-bg)}
.it-acts{display:flex;align-items:center;gap:6px;padding:0 12px 0 0}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);box-shadow:0 0 0 1px var(--line) inset}
.ib svg{width:20px;height:20px}
.ib.wa{color:var(--wa)}
.it-cta{grid-column:1/-1;margin:0 12px 12px 88px;height:42px;border-radius:12px;background:var(--orange-bg);color:var(--orange);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.now{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 0;border-top:1px solid var(--line);color:var(--mint-ink);font-weight:800;font-size:13px}
.now::before{content:"";width:72px;height:2px;background:var(--mint);flex:none}
.now::after{content:"";flex:1;height:2px;background:var(--mint);opacity:.35}
/* bloqueos en la lista */
.it.bq{--c:var(--ink-3);background:repeating-linear-gradient(135deg,var(--paper) 0 10px,var(--paper-2) 10px 20px)}
.it.bq .it-main{min-height:64px}
.it.bq .tm{font-size:21px;color:var(--ink-2)}
.it.bq .nm{font-size:15.5px;color:var(--ink-2)}
.bq-note{display:block;font-size:14px;color:var(--ink);margin-top:4px;white-space:normal}

/* colores de estado */
.s-conf_hoy,.s-conf{--c:var(--green);--cb:var(--green-bg)}
.s-conf_antes{--c:var(--amber);--cb:var(--amber-bg)}
.s-no_resp{--c:var(--red);--cb:var(--red-bg)}
.s-falta_esc{--c:var(--sand);--cb:var(--sand-bg)}
.s-falta_cargar{--c:var(--orange);--cb:var(--orange-bg)}
.s-firmo{--c:var(--green);--cb:var(--green-bg)}
.s-nofirmo{--c:var(--blue);--cb:var(--blue-bg)}
.s-novino{--c:var(--wine);--cb:var(--wine-bg)}
.s-reagenda{--c:var(--violet);--cb:var(--violet-bg)}
.s-nocaso{--c:var(--char);--cb:var(--char-bg)}

.empty{text-align:center;padding:40px 18px;color:var(--ink-2)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}
.empty .go{max-width:280px}

/* ===== Semana ===== */
.days{display:flex;gap:8px;margin:12px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 58px;border-radius:12px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;padding:5px 4px 6px;text-align:center}
.day .dw{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.day .dn{display:block;font-weight:800;font-stretch:var(--cond);font-size:21px;line-height:1.05}
.day .dc{display:block;font-size:11px;font-weight:700;color:var(--ink-2);margin-top:1px;white-space:nowrap}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%}
.day.today{box-shadow:0 0 0 2px var(--mint) inset}
.day.on{background:var(--navy);color:#fff;box-shadow:none}
.day.on .dw,.day.on .dc{color:#B9C3DA}
@media (prefers-color-scheme: dark){.day.on{background:var(--navy-2)}}
.sec-t{display:flex;align-items:center;gap:10px;margin:20px 2px 4px;font-size:17px;font-weight:800}
.sec-t .lk{margin-left:auto;height:34px;padding:0 12px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.sec-t .lk svg{width:15px;height:15px}

/* ===== Resumen ===== */
.sum-head{margin-top:14px;display:flex;align-items:flex-end;gap:12px}
.sum-big{font-weight:800;font-stretch:var(--cond);font-size:56px;line-height:.85}
.sum-cap{font-size:15px;font-weight:600;color:var(--ink-2);padding-bottom:4px}
.sum-cap b{display:block;color:var(--ink);font-size:17px}
.rbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:14px 0 4px}
.rbar i{display:block;height:100%}
.legend{list-style:none;margin:12px 0 0;padding:0;background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.lg{border-top:1px solid var(--line)}
.lg:first-child{border-top:0}
.lg > button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;text-align:left}
.sw{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.lg .ll{flex:1;font-weight:600;font-size:15.5px}
.lg .ll small{display:block;font-weight:500;font-size:12.5px;color:var(--ink-3)}
.lg .lv{font-weight:800;font-stretch:var(--cond);font-size:24px}
.lg .chev{color:var(--ink-3);transition:transform .2s;width:16px;height:16px;flex:none}
.lg.open .chev{transform:rotate(90deg)}
.lg-list{padding:0 10px 12px}
.rates{margin-top:16px;display:grid;gap:10px}
.rate{background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line) inset;padding:14px}
.rate h3{margin:0;font-size:15px;font-weight:700;color:var(--ink-2)}
.rate .rv{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.rate .rv b{white-space:nowrap;font-weight:800;font-stretch:var(--cond);font-size:38px;line-height:1}
.rate .rv span{font-size:14.5px;color:var(--ink-2);font-weight:500}
.rate .rp{margin-top:6px;font-size:13px;color:var(--ink-3);font-weight:500}
.rate .rp.up{color:var(--green)} .rate .rp.down{color:var(--red)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp div{border-radius:12px;padding:10px;background:var(--paper-2)}
.cmp b{display:block;font-weight:800;font-stretch:var(--cond);font-size:26px}
.cmp span{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.tbl{width:100%;border-collapse:collapse;margin-top:4px;font-size:15px}
.tbl th{text-align:right;font-size:12.5px;color:var(--ink-3);font-weight:600;padding:8px 4px 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:9px 4px;border-top:1px solid var(--line);font-weight:700}

/* ===== Navegación inferior ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;-webkit-transform:translateZ(0);transform:translateZ(0);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11.5px;font-weight:700;color:var(--ink-3);position:relative;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on::before{content:"";position:absolute;top:-6px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--mint)}
.badge[hidden]{display:none}
.badge{position:absolute;top:1px;left:calc(50% + 5px);min-width:19px;height:19px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* ===== Hoja (ficha y formularios) ===== */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:24px 24px 0 0;max-height:93vh;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(18px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:6px 0 2px}
.sh-hr{font-weight:800;font-stretch:var(--cond);font-size:44px;line-height:.9}
.sh-hr small{display:block;font-stretch:100%;font-size:13px;font-weight:600;color:var(--ink-3);margin-top:6px}
.sh-who{flex:1;min-width:0}
.sh-who h2{margin:0;font-size:22px;line-height:1.15;font-weight:800}
.sh-who .mt{margin-top:7px}
.close{width:40px;height:40px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center;flex:none}
.close svg{width:18px;height:18px}
.big-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.big-acts a{display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:14px;font-weight:800;font-size:16px;color:#fff;background:var(--navy)}
.big-acts a.wa{background:var(--wa)}
@media (prefers-color-scheme: dark){.big-acts a{background:var(--navy-2)}}
.big-acts svg{width:20px;height:20px}
.blk{margin-top:20px}
.blk-t{margin:0 2px 10px;font-size:17px;font-weight:800}
.blk-t small{display:block;font-size:13px;font-weight:500;color:var(--ink-3);margin-top:2px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ro{min-height:76px;border-radius:16px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15.5px;padding:8px;text-align:center}
.ro .e{font-size:22px;line-height:1}
.ro.on{background:var(--cb);color:var(--c);box-shadow:0 0 0 2.5px var(--c) inset}
.mot{display:grid;gap:8px;margin-top:12px}
.mo{min-height:50px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;display:flex;align-items:center;gap:11px;padding:0 15px;font-weight:700;font-size:15.5px;text-align:left}
.mo .rd{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px var(--ink-3) inset;flex:none}
.mo.on{box-shadow:0 0 0 2.5px var(--blue) inset;background:var(--blue-bg)}
.mo.on .rd{box-shadow:0 0 0 6px var(--blue) inset}
textarea,.inp,select{width:100%;border-radius:14px;border:0;box-shadow:0 0 0 1px var(--line) inset;padding:12px 14px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
textarea{min-height:86px;margin-top:10px;resize:vertical}
.inp,select{height:50px}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
textarea:focus,.inp:focus,select:focus{outline:none;box-shadow:0 0 0 2.5px var(--blue) inset}
.save-wrap{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:14px -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,transparent)}
.save{width:100%;height:56px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;font-size:17px}
@media (prefers-color-scheme: dark){.save{background:var(--mint);color:#062a20}}
.save:disabled{background:var(--line);color:var(--ink-3)}
.save.ok-armed{background:var(--green)!important;color:#fff!important}
@media (prefers-color-scheme: dark){.save.ok-armed{color:#062a20!important}}
.danger{width:100%;height:52px;border-radius:14px;background:var(--red-bg);color:var(--red);font-weight:800;font-size:16px;margin-top:16px}
.danger.armed{background:var(--red);color:#fff}
.note{background:var(--paper);border-radius:14px;padding:13px 14px;font-size:15px;color:var(--ink-2);box-shadow:0 0 0 1px var(--line) inset}
.box{background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line) inset;padding:2px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv > span{color:var(--ink-2);font-weight:500}
.kv > span small{display:block;font-size:12.5px;color:var(--ink-3)}
.kv > b{font-weight:700;text-align:right;word-break:break-word}
.kv .cp{font-size:14px;padding:5px 10px}
.kv.stack{display:block}
.kv.stack > span{display:block;font-size:13px;margin-bottom:3px}
.kv.stack > b{display:block;text-align:left;font-weight:600;white-space:pre-wrap}
.notes{background:var(--blue-bg);border-radius:var(--r-lg);padding:4px 16px}
.notes .kv{border-color:color-mix(in srgb,var(--blue) 18%,transparent)}
.notes .kv > span{color:var(--blue)}
.hint{font-size:13px;color:var(--ink-3);margin:8px 2px 0}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600;margin-top:12px}
.field{margin-top:14px}
.field label,.field .lbl{display:block;font-size:14px;font-weight:700;color:var(--ink-2);margin:0 2px 7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;padding:0 14px;font-weight:700;width:100%;text-align:left}
.tgl .sw2{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tgl .sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tgl.on .sw2{background:var(--mint)}
.tgl.on .sw2::after{transform:translateX(18px)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{height:44px;padding:0 16px;border-radius:12px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-weight:700}
.pick button.on{background:var(--navy);color:#fff;box-shadow:none}
@media (prefers-color-scheme: dark){.pick button.on{background:var(--mint);color:#062a20}}

/* ===== Buscador ===== */
.search{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column}
.search.on{display:flex}
.search-top{display:flex;gap:8px;align-items:center;padding:12px 16px;box-shadow:0 1px 0 var(--line)}
.search-top .inp{flex:1;height:46px;border-radius:12px}
.search-top .inp:focus{box-shadow:0 0 0 2.5px var(--mint) inset}
.search-body{flex:1;overflow-y:auto;padding:4px 16px 24px}

/* ===== Aviso, carga ===== */
.toast{position:fixed;left:16px;right:16px;bottom:calc(94px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;transform:translateY(16px);opacity:0;transition:all .22s;pointer-events:none;text-align:center}
.toast.on{transform:none;opacity:1}
.toast.err{background:var(--red);color:#fff}
.toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
.skel{height:84px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--line) 0%,var(--paper) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-top:12px;opacity:.7}
@keyframes sh{to{background-position:-200% 0}}
.err-box{background:var(--red-bg);color:var(--red);border-radius:14px;padding:16px;font-weight:700;margin-top:16px}
.err-box button{margin-top:10px;height:42px;padding:0 16px;border-radius:10px;background:var(--red);color:#fff;font-weight:700}
.foot{font-size:12.5px;color:var(--ink-3);text-align:center;margin:26px 0 6px}
.offline{background:var(--amber-bg);color:var(--amber);font-weight:700;font-size:13.5px;border-radius:10px;padding:8px 12px;margin-top:10px;display:none}
.offline.on{display:block}

/* ===== Resumen del caso ===== */
.it-rs{grid-column:1/-1;margin:-4px 14px 13px var(--rsx,96px);text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.36;color:var(--ink-2)}
.next-rs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px;font-size:14.5px;line-height:1.35;color:#C9D1E4}
.case{background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line) inset;padding:2px 16px}
.case .kv.stack > b{font-size:15.5px;line-height:1.42}
.blk-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* Zona táctil de 44px en "Editar" del Resumen del caso, sin cambiar cómo se ve */
.blk-row .mini{position:relative}
.blk-row .mini::after{content:'';position:absolute;left:-4px;right:-4px;top:-6px;bottom:-6px}
.mini{font-size:14px;font-weight:700;color:var(--blue);height:32px;padding:0 6px;border-radius:8px}
.missing{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border-radius:14px;box-shadow:0 0 0 1px var(--line) inset;padding:10px 10px 10px 14px;font-size:15px;color:var(--ink-2)}
.btn2{height:40px;padding:0 14px;border-radius:11px;background:var(--navy);color:#fff;font-weight:700;font-size:14.5px;flex:none;display:inline-flex;align-items:center;gap:7px}
.btn2 svg{width:17px;height:17px}
@media (prefers-color-scheme: dark){.btn2{background:var(--mint);color:#062a20}}
.paste{min-height:190px;margin-top:0;font-size:15px;line-height:1.4}
.link{width:100%;height:46px;margin-top:6px;font-weight:700;font-size:15px;color:var(--ink-2);border-radius:12px}
.rv-sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rv-sum .cp{font-size:13.5px;padding:5px 10px}
.rv-it{background:var(--paper);border-radius:16px;box-shadow:0 0 0 1px var(--line) inset;padding:12px 14px;margin-top:10px}
.rv-it.off .rv-who,.rv-it.off .rv-txt{opacity:.55}
.rv-top{display:flex;align-items:flex-start;gap:12px}
.ck{width:28px;height:28px;border-radius:8px;box-shadow:0 0 0 2px var(--ink-3) inset;flex:none;display:grid;place-items:center;margin-top:1px}
.ck.on{background:var(--mint);box-shadow:none;color:#062a20}
.ck svg{width:17px;height:17px}
.rv-who{flex:1;min-width:0}
.rv-who b{display:block;font-size:16.5px;line-height:1.2}
.rv-who span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px}
.rv-txt{margin-top:8px;font-size:14px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rv-w{margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--amber);background:var(--amber-bg);border-radius:9px;padding:7px 10px}
.rv-w.bad{color:var(--red);background:var(--red-bg)}
.rv-w.ok{color:var(--green);background:var(--green-bg)}
.rv-it select{height:46px;margin-top:8px;font-size:15px}
.todo{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.todo li{border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.todo button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left}
.todo .h{font-weight:800;font-stretch:var(--cond);font-size:21px;min-width:58px}
.todo .w{flex:1;min-width:0}
.todo .w b{display:block;font-size:15.5px;font-weight:700}
.todo .w span{font-size:13px;color:var(--ink-3)}
.todo .chev{width:16px;height:16px;color:var(--ink-3);flex:none}

/* ===== Roles, tareas, agendar, novedades ===== */
.nav button[hidden]{display:none}
.nav.six button{font-size:10.5px;letter-spacing:-.01em}
.cp.nw{color:#05261d;background:var(--mint)}
.cnt{font-weight:800;font-size:13px;min-width:24px;height:22px;border-radius:999px;background:var(--navy);color:#fff;display:inline-grid;place-items:center;padding:0 7px}
@media (prefers-color-scheme: dark){.cnt{background:var(--navy-2)}}
.sec-sub{margin:-2px 2px 10px;font-size:13.5px;color:var(--ink-3)}
.done{margin:0 2px;font-size:14.5px;font-weight:700;color:var(--green)}
.tk .tk-acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px 16px}
.cbtn{height:42px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--paper-2);box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap}
.cbtn.ok{color:var(--green)} .cbtn.no{color:var(--red)}
.cbtn.ok.on{background:var(--green-bg);box-shadow:0 0 0 2px var(--green) inset}
.cbtn.no.on{background:var(--red-bg);box-shadow:0 0 0 2px var(--red) inset}
.cbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.todo .go2{font-size:14px;font-weight:700;color:var(--blue);flex:none}
.todo li.pa-li{display:flex;align-items:center}
.est-n{color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.blk.est{border-radius:16px;transition:box-shadow .15s}
.est-tabs{margin:6px 0 4px}
.tr-blk .box{padding:12px}
.tr-tramo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.tr-tramo:first-child{border-top:0;padding-top:0}
.tr-l{flex:1;min-width:180px;display:flex;flex-direction:column}
.tr-l b{font-size:15px} .tr-l span{font-size:13.5px;color:var(--ink-2);word-break:break-word}
.tr-st{font-size:12.5px;font-weight:700;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:3px 8px}
.tr-st.ok{color:var(--green);background:var(--green-bg)}
.tr-rec{font-size:13px;font-weight:700;color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:9px;padding:6px 10px;margin:4px 6px 0 0}
.tr-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tr-acts .btn2{flex:1 1 auto}
.tr-rein{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14.5px}
.tr-rein .save{width:auto;margin:0 0 0 auto;padding:0 16px;height:38px}
.tr-rein small{width:100%;color:var(--ink-3)}
.tr-rein.ok{color:var(--green)}
.tr-aviso{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--amber-bg);color:var(--ink);box-shadow:0 0 0 1.5px var(--amber) inset;font-size:14.5px}
.tr-aviso span{flex:1 1 220px}
.tr-aviso button{font-weight:700;font-size:13.5px;padding:7px 11px;border-radius:9px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset}
.tr-aviso.plata{background:var(--green-bg);box-shadow:0 0 0 1.5px var(--green) inset}
.tr-acts .tr-x{color:var(--red)}
.tr-aviso.rojo{background:var(--red-bg);box-shadow:0 0 0 1.5px var(--red) inset}
.rep-w{margin-top:12px} .rep-n{color:var(--amber);font-weight:600}
.todo li.tr-urg{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.blk.est.drag{box-shadow:0 0 0 2px var(--mint) inset;background:color-mix(in srgb,var(--mint) 8%,transparent)}
.est-l li{display:flex;align-items:center}
.est-l li > button[data-estver]{flex:1;min-width:0}
.est-l .w b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est-ic{font-size:20px;flex:none}
.est-l .est-x{width:auto;flex:none;margin-right:8px;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-3)}
.est-l .est-x.on{color:#fff;background:var(--red)}
.est-drop{position:relative;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;margin-top:8px;padding:16px 14px;border:2px dashed var(--line);border-radius:14px;background:var(--paper);cursor:pointer}
.est-drop b{font-size:15.5px;color:var(--blue)} .est-drop span{font-size:13px;color:var(--ink-3)}
.est-drop{width:100%}
.est-up{display:flex;align-items:center;gap:10px;margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-size:14px;color:var(--ink-2)}
.est-visor{position:fixed;inset:0;z-index:300;background:rgba(10,14,25,.92);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.est-vh{display:flex;align-items:center;gap:8px;color:#fff;padding:4px 2px 10px}
.est-vh b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.est-vh .mini{color:#fff;background:rgba(255,255,255,.14);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;text-decoration:none}
.est-vh .close{color:#fff;background:rgba(255,255,255,.14)}
.est-vb{flex:1;width:100%;border:0;border-radius:12px;background:#fff}
.est-img{display:flex;align-items:center;justify-content:center;overflow:auto;background:transparent}
.est-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.todo li.pa-li > button[data-ficha]{flex:1;min-width:0}
.todo li.pa-li .pa-ag{width:auto;flex:none;gap:6px;margin-right:10px;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:700;color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.todo li.pa-li .pa-ag svg{width:16px;height:16px}
.todo li.pa-li .ib.sc-wa{flex:none;width:40px;height:40px;margin-right:8px}
.sc-rama{margin:14px 0 6px;font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.sc-rama .cnt{font-size:12px}
.btn3{width:100%;height:46px;margin-top:10px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn3 svg{width:18px;height:18px}
.nov{background:var(--paper);border-radius:var(--r-lg);box-shadow:0 0 0 2px var(--mint) inset;padding:10px 6px 6px;margin-top:8px}
.nov-h{display:flex;align-items:center;gap:8px;padding:0 8px 4px}
.nov-h b{font-size:17px;font-weight:800}
.nov-h .mini{margin-left:auto}
.nov ul{list-style:none;margin:0;padding:0}
.nov li button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;padding:8px;border-radius:12px}
.nov-t{grid-row:span 2;align-self:center;font-size:12px;font-weight:800;color:#05261d;background:var(--mint);border-radius:7px;padding:3px 7px;white-space:nowrap}
.nov-w{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nov-d{font-size:13px;color:var(--ink-3)}
.ag{background:var(--paper);border-radius:16px;box-shadow:0 0 0 1px var(--line) inset;padding:12px;margin-top:10px}
.ag-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
.ag-h b{font-size:17px;font-weight:800}
.ag-h span{font-size:13px;color:var(--ink-3)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.slot{height:42px;border-radius:11px;background:var(--paper-2);box-shadow:0 0 0 1px var(--line) inset;font-weight:800;font-stretch:var(--cond);font-size:17px}
.slot.on{background:var(--navy);color:#fff;box-shadow:none}
@media (prefers-color-scheme: dark){.slot.on{background:var(--mint);color:#062a20}}
.ag-note{margin:8px 2px 0;font-size:13px;color:var(--ink-3)}
.ag-bq{margin:0 2px;font-size:14px;font-weight:600;color:var(--ink-2)}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{min-height:64px;border-radius:16px;background:var(--paper);box-shadow:0 0 0 1px var(--line) inset;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.who small{font-size:12px;font-weight:600;color:var(--ink-3)}

<script>
(function(){
  'use strict';
  var TZ = 'America/Buenos_Aires';
  var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

    firmo:        {i:'✔', l:'Firmó'},
    nofirmo:      {i:'🔵', l:'Vino y no firmó'},
    novino:       {i:'✖', l:'No vino'},
    reagenda:     {i:'↻', l:'Pidió reagendar'},
    nocaso:       {i:'⚫', l:'No es caso'}

    {k:'firmo',   e:'✔', l:'Firmó',           s:'firmo'},

    {k:'nocaso',  e:'⚫', l:'No es caso',      s:'nocaso'}
  ];
  var FASE_RES = {'Caso en proceso':'firmo','Seguimiento':'nofirmo','No show':'novino','C':'nocaso'};
  var PEND = ['conf_hoy','conf','conf_antes','no_resp','falta_esc'];
  var SINCONF = ['conf_antes','no_resp','falta_esc'];
  var CONRES = ['firmo','nofirmo','novino','nocaso','reagenda'];

  var state = {
    data:null, view:'hoy', abog:null, week:0, weekDay:null,
    chip:{hoy:'todas', manana:'todas', semana:'todas'},
    sheet:null, // {type:'lead'|'bloq'|'nuevo', id}
    draft:null, sumOpen:null, busy:false, offline:false,
    me:null, seen:null, primeraVez:true
  };
  var $ = function(id){ return document.getElementById(id); };
  function store(k,v){ try{ if (v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  /* ---------- fechas ---------- */
  function nowBA(){
    var p = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    var g = function(t){ for (var i=0;i<p.length;i++) if (p[i].type===t) return p[i].value; return '0'; };
    var h = parseInt(g('hour'),10)%24, m = parseInt(g('minute'),10);
    return { date: g('year')+'-'+g('month')+'-'+g('day'), min: h*60+m, hm: ('0'+h).slice(-2)+':'+('0'+m).slice(-2) };
  }
  function toUTC(s){ var a=s.split('-'); return new Date(Date.UTC(+a[0],+a[1]-1,+a[2])); }
  function fmt(d){ return d.toISOString().slice(0,10); }
  function addDays(s,n){ var d=toUTC(s); d.setUTCDate(d.getUTCDate()+n); return fmt(d); }
  function diffDays(a,b){ return Math.round((toUTC(a)-toUTC(b))/86400000); }
  function dow(s){ return toUTC(s).getUTCDay(); }
  function mondayOf(s){ return addDays(s, -((dow(s)+6)%7)); }
  function isHabil(s){ var w=dow(s); return w!==0 && w!==6 && (state.data.feriados||[]).indexOf(s)===-1; }
  function nextHabil(s){ var d=addDays(s,1); while(!isHabil(d)) d=addDays(d,1); return d; }
  function dnum(s){ return +s.slice(8,10); }
  function mnum(s){ return +s.slice(5,7)-1; }
  function longDate(s){ return DIAS[dow(s)]+' '+dnum(s)+' de '+MESES[mnum(s)]; }
  function shortDate(s){ return DIAS_C[dow(s)]+' '+dnum(s)+'/'+(mnum(s)+1); }
  function hmin(h){ if(!h) return null; var a=h.split(':'); return +a[0]*60 + +a[1]; }
  function enCuanto(mins){
    if (mins<=0) return 'Empieza ahora';
    if (mins<60) return 'En '+mins+' min';
    var h=Math.floor(mins/60), m=mins%60;
    return 'En '+h+' h'+(m?' '+m+' min':'');
  }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  /* ---------- estados ---------- */
  function statusOf(l){
    var n = nowBA();
    if (FASE_RES[l.fase]) return FASE_RES[l.fase];
    var m = hmin(l.hora);
    var pasado = l.fecha < n.date || (l.fecha === n.date && m !== null && n.min >= m + PASADO_MIN);
    if (pasado) return l.fase === 'Reagenda' ? 'reagenda' : 'falta_cargar';
    if (l.fecha === n.date){
      if (l.confDia === 'Confirmó') return 'conf_hoy';
      if (l.confDia === 'No respondió') return 'no_resp';
      if (l.confPrev === 'Confirmó') return 'conf_antes';
      if (l.confPrev === 'No respondió') return 'no_resp';
      return 'falta_esc';
    }
    if (l.confPrev === 'Confirmó') return 'conf';
    if (l.confPrev === 'No respondió') return 'no_resp';
    return 'falta_esc';
  }
  function isPend(s){ return PEND.indexOf(s)!==-1; }
  // Pide resultado: ya pasó la hora sin cargar, o ya empezó hoy
  function needsResult(l){
    var s=statusOf(l), n=nowBA();
    return s==='falta_cargar' || (l.fecha===n.date && isPend(s) && hmin(l.hora)!==null && n.min >= hmin(l.hora));
  }
  function confFinal(l){ return l.confDia || l.confPrev || ''; }
  function confIcon(v){ return v==='Confirmó' ? '✅' : (v==='No respondió' ? '🔴' : '⏳'); }
  function confCls(v){ return v==='Confirmó' ? ' ok' : (v==='No respondió' ? ' no' : ''); }

  /* ---------- utilidades ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function normTxt(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function phone(t){
    var d = String(t||'').replace(/\D/g,'');
    if (d.indexOf('54')===0 && d.length>=12) d = d.slice(2);
    if (d.charAt(0)==='9' && (d.length===11 || d.length===13)) d = d.slice(1);
    if (d.charAt(0)==='0') d = d.slice(1);
    if (d.length===12){ for (var a=2;a<=4;a++){ if (d.substr(a,2)==='15'){ d = d.slice(0,a)+d.slice(a+2); break; } } }
    if (d.length===9 && d.indexOf('15')===0) d = '261'+d.slice(2); // "15 555-1234" sin característica: Mendoza
    else if (d.length===7) d = '261'+d;                             // fijo sin característica: Mendoza
    return d;
  }
  function telHref(t){ var p=phone(t); return p.length===10 ? 'tel:+549'+p : 'tel:'+p; }
  function waHref(t){ return 'https://wa.me/549'+phone(t); }
  function byTime(a,b){ return (a.fecha+(a.hora||'99:99')).localeCompare(b.fecha+(b.hora||'99:99')); }
  function ramaKey(r){ r=normTxt(r); return r.indexOf('trans')===0?'transito':(r==='laboral'?'laboral':'art'); }
  function ramaLabel(r){ var k=ramaKey(r); return k==='transito'?'Tránsito':(k==='laboral'?'Laboral':'ART'); }
  function plural(n,a,b){ return n+' '+(n===1?a:b); }
  /* Marcas: Reclamá (ART y Laboral) y Derecho en Tránsito (aparte). Quien ve las dos elige cuál mirar en la agenda. */
  var VISTAS_AGENDA={agenda:1, hoy:1, manana:1, semana:1, falta:1};
  function marcaDe(r){ return ramaKey(r)==='transito' ? 'transito' : 'reclama'; }
  function marcasVisibles(){ var a=P().agenda||['ART','LABORAL','TRANSITO'], m=[]; a.forEach(function(r){ var k=marcaDe(r); if (m.indexOf(k)===-1) m.push(k); }); return m; }
  /* Agenda por rama: Todas · ART · Laboral · Tránsito. Cada rama muestra solo a quienes la atienden. */
  function ramasAgVis(){ var a=P().agenda||['ART','LABORAL','TRANSITO'], k=a.map(ramaKey); return ['art','laboral','transito'].filter(function(x){ return k.indexOf(x)!==-1; }); }
  function marcaAg(){ var vs=ramasAgVis(); if (vs.length<2) return 'todas'; var x=state.marca||store('ramaAg')||'todas'; return (x==='todas' || vs.indexOf(x)!==-1) ? x : 'todas'; }
  function filtraMarca(){ return marcaAg()!=='todas' && !!VISTAS_AGENDA[state.view]; }
  function personaEnMarca(a, m){ var R=(state.data && state.data.ramasPorPersona)||{}; return !R[a] || R[a].some(function(r){ return ramaKey(r)===m; }); }
  function personas(){ var xs=(state.data.abogadas||[]).slice(); if (!filtraMarca()) return xs; var m=marcaAg(); return xs.filter(function(a){ return personaEnMarca(a, m); }); }
  function inScope(nombre){ return !state.abog || state.abog==='Todas' || (nombre||'Sin asignar')===state.abog; }
  function marcaOk(l){ return !filtraMarca() || ramaKey(l.rama)===marcaAg(); }
  function leads(){ return state.data.leads.filter(function(l){ return inScope(l.abogada) && marcaOk(l); }); }
  function onDate(d){ return leads().filter(function(l){ return l.fecha===d; }); }
  function bloqueos(d){ var m=filtraMarca()?marcaAg():null; return (state.data.bloqueos||[]).filter(function(b){ return (!d || b.fecha===d) && inScope(b.abogada) && (!m || personaEnMarca(b.abogada, m)); }); }
  function bqStart(b){ return b.todoDia ? '00:00' : (b.desde||'00:00'); }
  function orderPeople(names){
    var base = personas();
    names.forEach(function(a){ if (base.indexOf(a)===-1) base.push(a); });
    return base.filter(function(a){ return names.indexOf(a)!==-1; });
  }

  var I = {
    call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.5 8.5 0 1 1 21 11.5Z"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
    pen:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
    swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5l4 4-4 4"/><path d="M20 7.5H8a4 4 0 0 0-4 4"/><path d="M8 20.5l-4-4 4-4"/><path d="M4 16.5h12a4 4 0 0 0 4-4"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2.5" width="8" height="4" rx="1.3"/><path d="M16 4.5h1.5a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2H8"/></svg>'
  };

  /* ---------- servidor ---------- */
  // Lo que cambia la agenda o los leads: mientras algo de esto está en camino, una actualización no pisa lo que se ve
  var ESCRIBE={saveAction:1, saveResumenes:1, deshacerResultado:1, agendar:1, reagendaSinDia:1, derivar:1, agendarNuevo:1, cambiarFase:1, editarDatos:1, agregarNota:1, saveBloqueo:1, deleteBloqueo:1, pedirInterna:1, responderInterna:1, derivarMarca:1, saveDisponibilidad:1};
  // Lo que se puede repetir sin duplicar nada: si se corta internet o el servidor no contesta, se reintenta solo antes de avisar
  var REINTENTA={getData:1, saveAction:1, cambiarFase:1, saveResumenes:1, editarDatos:1, deshacerResultado:1};
  // Finanzas: cada pedido lleva la llave (PIN de finanzas). Vive solo en la memoria de la app: al cerrarla, se vuelve a pedir
  var FIN_FN={getFin2:1, getFin2Panel:1, saveFin2:1, resolverRepFin2:1, getFinanzas:1, saveFinanza:1, borrarFinanza:1};
  function esCorte(e){ return /Sin conexi|no respondi|Failed to fetch|NetworkError|Load failed|network|timeout|JSON|Unexpected token/i.test(String((e&&e.message)||e)); }
  function call1(fn, arg){
    return new Promise(function(res, rej){
      // App instalable (pantalla publicada aparte): habla con el mismo servidor por POST
      if (window.API_URL){
        fetch(window.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn:fn, arg:arg}), redirect:'follow' })
          .then(function(r){ if (!r.ok) throw new Error('El servidor no respondió ('+r.status+'). Probá de nuevo.'); return r.json(); })
          .then(function(x){ if (x && x.ok) res(x.data); else rej(new Error((x && x.error) || 'Error del servidor.')); })
          .catch(function(e){ rej(/fetch|network|load failed/i.test(String(e && e.message)) ? new Error('Sin conexión. Revisá internet y probá de nuevo.') : e); });
        return;
      }
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);
    });
  }
  function call(fn, arg){
    // Cada llamada lleva la sesión (token del PIN). Si venció, se vuelve a pedir el PIN.
    if (Array.isArray(arg)) arg = {items:arg};
    if (arg === undefined || arg === null) arg = {};
    if (typeof arg==='object'){ arg.tok = store('tok') || ''; if (state.me) arg.who = state.me.nombre; if (FIN_FN[fn]) arg.ftok = finTok(); }
    var w=!!ESCRIBE[fn], esperas=REINTENTA[fn] ? [1500, 4000] : [];
    if (w){ state.wPend=(state.wPend||0)+1; state.wSeq=(state.wSeq||0)+1; }
    var p=new Promise(function(res, rej){
      var intento=function(k){
        call1(fn, arg).then(function(x){ if (REP_CAMBIA[fn]) repInvalidar(); if (FIN_FN[fn] && state.ftok) state.ftokT=Date.now(); res(x); }, function(e){
          var msg = (e && e.message) ? e.message : String(e);
          if (/FIN\|/.test(msg)){ finCerrar(true); rej(new Error(msg.replace(/^.*FIN\|/, ''))); return; }
          if (/AUTH\|/.test(msg)){ sinSesion(); rej(new Error(msg.replace(/^.*AUTH\|/, ''))); return; }
          if (k<esperas.length && esCorte(e)){ setTimeout(function(){ intento(k+1); }, esperas[k]); return; }
          rej(e && e.message ? e : new Error(msg));
        });
      };
      intento(0);
    });
    if (w){ var fin=function(){ state.wPend=Math.max(0,(state.wPend||0)-1); if (!state.wPend && state.wRecargar){ state.wRecargar=false; setTimeout(function(){ load(true); }, 300); } }; p.then(fin, fin); }
    return p;
  }
  var recibir = null;
  function load(silent, fresh){
    if (!store('tok')){ abrirIngreso(); return; }
    if (state.busy) return;
    if (fresh){ state.otras={}; state.busq=null; state.otrasPre=false; } // Actualizar: las otras fases se vuelven a pedir
    state.busy = true; $('btnRefresh').classList.add('spin');
    var seq0=state.wSeq||0;
    call('getData', {fresh: !!fresh, who: store('yo') || ''}).then(recibir = function(d){
      // Si mientras llegaba se guardó algo (o sigue guardándose), esta lectura puede ser de antes: no se usa y se pide otra al terminar
      if (!d.__snap && state.data && (state.wPend || (state.wSeq||0)!==seq0)){ if (state.wPend) state.wRecargar=true; else setTimeout(function(){ load(true); }, 300); return; }
      if (d.__snap){ state.snapT=d.__snapT; } else { state.snapT=null; try{ store('snap', JSON.stringify({t:Date.now(), d:d})); }catch(e){} }
      state.data = d; state.offline = false;
      if (d.user && d.user.name && !d.__snap){ var yoSrv=(d.equipo||[]).filter(function(e){ return e.nombre===d.user.name; })[0]; if (yoSrv){ state.me=yoSrv; store('yo', yoSrv.nombre); } }
      if (!state.me) state.me = resolveMe(d);
      if (!state.seen) initSeen();
      if (!d.__snap){ setTimeout(precargarRep, 1500); setTimeout(precargarFin, 2500); setTimeout(calentarFin, 2000); }
      // Guiones: se piden apenas abre la app (con lo guardado en el celular ya alcanza para saber quién es); a producción, enseguida
      if (!state.crePre && (((d.permisos||{}).creativos)||[]).length){ state.crePre=true; setTimeout(precargarCre, (state.me && state.me.rol==='produccion') ? 0 : 1200); }
      if (state.primeraVez && state.me && state.me.rol==='intaker') state.view='tareas';
      if (state.abog===null && state.me && state.me.rol==='abogada' && !store('abogada')) state.abog = state.me.nombre;
      if (state.abog===null){
        var saved = store('abogada');
        state.abog = (saved && (saved==='Todas' || (d.abogadas||[]).indexOf(saved)!==-1)) ? saved : ((d.user && d.user.abogada) || 'Todas');
      }
      render();
      if (state.sheet && (state.sheet.type==='lead' || state.sheet.type==='bloq') && !escribiendo()) renderSheet();
      if (state.primeraVez){ state.primeraVez=false; if (!state.me && d.modoPrueba) openSheet({type:'yo', first:true}); }
      if ($('search').classList.contains('on')) renderSearch();
      avisoNuevos(d);
    }).catch(function(e){
      if (!state.data){
        $('main').innerHTML = '<div class="err-box">No se pudieron cargar las consultas.<br><small>'+esc(e.message)+'</small><br><button data-retry>Reintentar</button></div>';
      } else { state.offline = true; render(); }
    }).then(function(){ state.busy=false; $('btnRefresh').classList.remove('spin'); });
  }

  /* ---------- resúmenes de los intakers ---------- */
  var K_NOMBRE = ['nombre','nombre y apellido','nombre completo','apellido y nombre','cliente'];
  var K_TEL = ['tel','telefono','cel','celular','whatsapp','wsp','numero','contacto','telefono de contacto'];
  var K_CONS = ['consulta','turno','fecha','fecha consulta','fecha de consulta','dia y hora','hora','horario'];
  var WA_PREFIX = [/^\s*\[[^\]\n]{4,40}\]\s*[^:\n]{1,40}:\s?/, /^\s*\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}[^\n-]{0,14}-\s*[^:\n]{1,40}:\s?/];
  function keyOf(k){ return normTxt(k).replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim(); }
  function pad2(n){ return ('0'+n).slice(-2); }
  // Separa lo pegado en mensajes (uno por cada "Nombre:") con sus campos "Clave: valor".
  // Las líneas sin clave se suman al campo anterior.
  function parseMsgs(text){
    var blocks=[], cur=null, last=null;
    function nuevo(n){ cur={nombre:n||'', tel:'', consulta:'', fields:[]}; blocks.push(cur); last=null; }
    String(text||'').replace(/\r/g,'').split('\n').forEach(function(raw){
      var line=raw.replace(/[‎‏‪-‮]/g,'');
      WA_PREFIX.forEach(function(re){ line=line.replace(re,''); });
      line=line.replace(/[*~]/g,'').trim();
      if (!line) return;
      var m=line.match(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .\/()]{0,28}?)\s*:\s*(.*)$/), k=m?keyOf(m[1]):'';
      if (m && (!k || k.split(' ').length>4 || /^\/\//.test(m[2]))) m=null;
      if (m){
        var v=m[2].trim();
        if (K_NOMBRE.indexOf(k)!==-1){ nuevo(v); return; }
        if (!cur) nuevo('');
        if (K_TEL.indexOf(k)!==-1){ cur.tel=cur.tel||v; last=null; return; }
        if (K_CONS.indexOf(k)!==-1){ cur.consulta=(cur.consulta?cur.consulta+' ':'')+v; last=null; return; }
        last={k:m[1].trim(), v:v}; cur.fields.push(last); return;

  }

  var SEP='¦';

  function slotsDe(a, fecha, l, pasados){
    var H=state.data.horario||{desde:'09:00',hasta:'19:00',cada:30}, D=state.data.duracion||30, n=nowBA(), libres=[];
    var ocup=state.data.leads.filter(function(o){ return o.id!==l.id && o.abogada===a && o.fecha===fecha && (o.fase==='Consulta agendada' || o.fase==='Reagenda'); }).sort(byTime);
    var bq=(state.data.bloqueos||[]).filter(function(b){ return b.abogada===a && b.fecha===fecha; });
    var todo=bq.filter(function(b){ return b.todoDia; })[0]||null;
    var R=state.data.dispRango||{desde:H.desde, hasta:H.hasta}, m0=Math.min(hmin(H.desde),hmin(R.desde)), m1=Math.max(hmin(H.hasta),hmin(R.hasta));

  function f2Input(ev){
    var k=ev.target.getAttribute && ev.target.getAttribute('data-f2k'); if (!k || !state.draft || !state.sheet || state.sheet.type!=='fin2') return;
    state.draft.v[k]=ev.target.value;
    var c=f2Campos(state.sheet.tipo).filter(function(x){ return x.k===k; })[0]||{}, h=$(ev.target.id+'h'); if (h) h.textContent=c.pct?f2HonTxt(c, ev.target.value):montoTxt(ev.target.value);
    // Facturado: al elegir el caso, se completa la parte de la ART de esa homologación
    if (state.sheet.tipo==='factura' && k==='caso'){
      var pa=((f2Base()||{}).parteArtCaso||{})[ev.target.value], m=document.querySelector('#sheet [data-f2k="monto"]');
      if (pa && m && !String(m.value||'').trim()){ m.value=String(pa); state.draft.v.monto=String(pa); var mh=$(m.id+'h'); if (mh) mh.textContent=montoTxt(String(pa)); }
    }
  }
  document.addEventListener('input', f2Input); document.addEventListener('change', f2Input);
  $('btnRefresh').addEventListener('click', function(){ if (enFinanzas()){ state.f2={}; state.finFresco=true; render(); } });

  load(false);
  (function(){ // Disponibilidad: tocar marca o desmarca media hora; mantener apretado y deslizar pinta varias (en la compu, arrastrar)
    var g=null, t0=null, timer=0;
    function slotEn(col, y){
      var rows=col.querySelectorAll('.de-s'); if (!rows.length) return null;
      var r0=rows[0].getBoundingClientRect(), i=Math.floor((y-r0.top)/r0.height);
      i=Math.max(0, Math.min(rows.length-1, i)); return +rows[i].getAttribute('data-s');
    }
    function pintar(){
      var de=state.dispEdit; if (!g || !de) return;
      var arr=g.snap.slice(), a=Math.min(g.s0,g.s1), b=Math.max(g.s0,g.s1);
      for (var s=a;s<=b;s++) arr[s]=g.val;
      de.dias[g.d]=arr;
      [].forEach.call(g.col.querySelectorAll('.de-s'), function(el){ var s=+el.getAttribute('data-s'); el.classList.toggle('on', !!arr[s]); el.classList.toggle('pt', g.largo && s>=a && s<=b); });
    }
    function empezar(sl, largo){
      var de=state.dispEdit, col=sl.closest('.de-col'); if (!de || !col) return;
      var d=col.getAttribute('data-ded'), s=+sl.getAttribute('data-s');
      // La primera media hora define si se marca o se desmarca
      g={col:col, d:d, s0:s, s1:s, snap:de.dias[d].slice(), val:!de.dias[d][s], largo:largo};
      de.dirty=true; state.pintando=true; pintar();
      if (largo){ try{ if (navigator.vibrate) navigator.vibrate(15); }catch(e){} }
    }
    function terminar(){ if (!g) return; g=null; state.pintando=false; render(); }
    // Compu (mouse): apretar y arrastrar, siempre dentro del mismo día
    document.addEventListener('pointerdown', function(ev){
      if (ev.pointerType!=='mouse' || ev.button!==0 || !state.dispEdit || !ev.target.closest) return;
      var sl=ev.target.closest('.de-s'); if (!sl) return;
      ev.preventDefault(); empezar(sl, true);
    });
    document.addEventListener('pointermove', function(ev){ if (!g || ev.pointerType!=='mouse') return; var s=slotEn(g.col, ev.clientY); if (s!==null && s!==g.s1){ g.s1=s; pintar(); } });
    document.addEventListener('pointerup', function(ev){ if (ev.pointerType==='mouse') terminar(); });
    // Celular: tocar = una media hora; mantener apretado y deslizar = varias. Deslizar rápido mueve la pantalla, como siempre.
    document.addEventListener('touchstart', function(ev){
      if (!state.dispEdit || ev.touches.length!==1 || !ev.target.closest) return;
      var sl=ev.target.closest('.de-s'); if (!sl){ t0=null; return; }
      var tc=ev.touches[0]; t0={x:tc.clientX, y:tc.clientY, sl:sl, movio:false};
      clearTimeout(timer); timer=setTimeout(function(){ if (t0 && !t0.movio && !g) empezar(t0.sl, true); }, 300);
    }, {passive:true});
    document.addEventListener('touchmove', function(ev){
      if (g){ ev.preventDefault(); var s=slotEn(g.col, ev.touches[0].clientY); if (s!==null && s!==g.s1){ g.s1=s; pintar(); } return; }
      if (!t0) return;
      var tc=ev.touches[0]; if (Math.abs(tc.clientX-t0.x)>8 || Math.abs(tc.clientY-t0.y)>8){ t0.movio=true; clearTimeout(timer); }
    }, {passive:false});
    document.addEventListener('touchend', function(ev){
      clearTimeout(timer);
      if (g){ t0=null; terminar(); ev.preventDefault(); return; }
      if (t0 && !t0.movio){ var sl=t0.sl; t0=null; empezar(sl, false); terminar(); ev.preventDefault(); return; }
      t0=null;
    }, {passive:false});
    document.addEventListener('touchcancel', function(){ clearTimeout(timer); t0=null; if (g) terminar(); });
    document.addEventListener('contextmenu', function(ev){ if (state.dispEdit && ev.target.closest && ev.target.closest('.de-s')) ev.preventDefault(); });
  })();
  // Abrir al instante: mientras llega lo nuevo, se muestra lo último que se cargó en este dispositivo (hasta 12 horas)
  try{
    var sn=JSON.parse(store('snap')||'null');
    if (sn && sn.d && !state.data && recibir && store('tok') && Date.now()-sn.t < 12*3600*1000){
      var dd=new Date(sn.t); sn.d.__snap=true; sn.d.__snapT=('0'+dd.getHours()).slice(-2)+':'+('0'+dd.getMinutes()).slice(-2);
      recibir(sn.d);
    }
  }catch(e){}
})();
</script>

if ('serviceWorker' in navigator) { var swHabia=!!navigator.serviceWorker.controller, swRec=false; navigator.serviceWorker.addEventListener('controllerchange', function(){ if (!swHabia || swRec) return; swRec=true; location.reload(); }); window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').then(function(r){ document.addEventListener('visibilitychange', function(){ if (!document.hidden) r.update().catch(function(){}); }); }).catch(function(){}); }); }
</script>
